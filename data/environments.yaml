# Ambientes habitados de referencia para el selector (O1, C6).
# Datos de investigación previa al evento. Cada valor tiene source_id en data/sources.json.
# Unidades: pressure_kpa (kPa), o2_mole_fraction (0-1). psia se guarda solo como referencia del texto de origen.
# Regla de oro: si un valor no tiene fuente, va null con status: missing.

- id: sea_level_air
  name: "Sea-level air (1 g reference)"
  pressure_psia: 14.7
  pressure_kpa: 101.3
  o2_mole_fraction: 0.209
  gravity_regime: earth
  source_id: challenge-2026-flame-in-freefall
  status: ok
  note: "The challenge text gives 14.7 psi at sea level; 20.9% O2 is standard dry air [verify citation for O2]."

- id: iss_cabin
  name: "ISS cabin"
  pressure_psia: null
  pressure_kpa: null
  o2_mole_fraction: null
  gravity_regime: microgravity
  source_id: null
  status: missing
  note: "Find a NASA source for nominal ISS cabin pressure and O2 before using this preset."

- id: exploration_atmosphere_2012
  name: "NASA exploration atmosphere (2012 proposal)"
  pressure_psia: 8.2
  pressure_kpa: 56.5
  o2_mole_fraction: 0.34
  gravity_regime: lunar
  source_id: wessel-2018-amhp
  status: ok
  note: >
    Balance N2. Proposed to reduce decompression sickness risk for EVA. The paper notes 31.4% O2 is the calculated
    limit for no increase in burning rate at 8.2 psia, so this is classified as an increased-burning-rate atmosphere.
    The gravity regime depends on where it is used (vehicle vs. surface habitat).

- id: exploration_atmosphere_2005
  name: "NASA exploration atmosphere (2005 decision)"
  pressure_psia: 8.0
  pressure_kpa: 55.2
  o2_mole_fraction: 0.32
  gravity_regime: lunar
  source_id: wessel-2018-amhp
  status: ok

- id: shuttle_staged
  name: "Space Shuttle staged EVA protocol"
  pressure_psia: 10.2
  pressure_kpa: 70.3
  o2_mole_fraction: 0.265
  gravity_regime: microgravity
  source_id: wessel-2018-amhp
  status: ok
  note: "Used on 41 Shuttle missions according to the paper."

- id: moon_base_challenge
  name: "Moon base (challenge guidance)"
  pressure_psia: 10.2          # "10.2 psi or less"
  pressure_kpa: 70.3
  o2_mole_fraction: 0.30       # "about 30% or more"
  gravity_regime: lunar
  source_id: challenge-2026-flame-in-freefall
  status: ok
  note: "These are upper and lower bounds rather than a point: draw as a region (O2 >= 0.30, P <= 70.3 kPa)."

- id: spacesuit
